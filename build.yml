name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html privacy.html admob.json www/
          sed -i "s#window.open('privacy.html','_blank')#location.href='privacy.html'#" www/index.html
          grep -q "location.href='privacy.html'" www/index.html

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add AdMob App ID to AndroidManifest
        run: |
          python3 - <<'PY'
          import json
          c = json.load(open('www/admob.json'))
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % c['appId']
          assert '</application>' in s
          s = s.replace('</application>', meta + '\n    </application>', 1)
          open(p, 'w').write(s)
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Quiz-Battle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
