{c:"gk",d:"medium",q:{en:"Which is the longest river in the world (traditional measure)?",hi:"दुनिया की सबसे लंबी नदी कौन-सी है (पारंपरिक माप)?",ne:"संसारको सबैभन्दा लामो नदी कुन हो (परम्परागत नाप)?"},o:["Amazon","Nile","Ganga","Yangtze"],a:1,e:{en:"The Nile in Africa is about 6,650 km long. 💡 Fact: Some measurements say the Amazon is longer, so scientists still debate it.",hi:"अफ्रीका की नील नदी लगभग 6,650 किमी लंबी है। 💡 तथ्य: कुछ माप में अमेज़न लंबी बताई जाती है, इसलिए इस पर बहस जारी है।",ne:"अफ्रिकाको नाइल नदी करिब ६,६५० किमी लामो छ। 💡 तथ्य: केही नापमा अमेजन लामो भनिन्छ, त्यसैले यसबारे बहस जारी छ।"}},
{c:"gk",d:"medium",q:{en:"What is the capital of Australia?",hi:"ऑस्ट्रेलिया की राजधानी क्या है?",ne:"अष्ट्रेलियाको राजधानी के हो?"},o:["Sydney","Melbourne","Canberra","Perth"],a:2,e:{en:"Canberra is the capital, not Sydney. 💡 Fact: Canberra was built as a compromise between Sydney and Melbourne.",hi:"राजधानी कैनबरा है, सिडनी नहीं। 💡 तथ्य: कैनबरा को सिडनी और मेलबर्न के बीच समझौते के रूप में बनाया गया था।",ne:"राजधानी क्यानबेरा हो, सिड्नी होइन। 💡 तथ्य: क्यानबेरा सिड्नी र मेलबर्नबीचको सम्झौताका रूपमा बनाइएको थियो।"}},
{c:"gk",d:"hard",q:{en:"Which country has the most time zones (including its territories)?",hi:"किस देश में (अपने क्षेत्रों सहित) सबसे ज़्यादा टाइम ज़ोन हैं?",ne:"कुन देशमा (आफ्ना क्षेत्रसहित) सबैभन्दा धेरै टाइम जोन छन्?"},o:["Russia","USA","France","China"],a:2,e:{en:"France has 12 time zones because of its overseas territories. 💡 Fact: Russia has 11 on its mainland.",hi:"फ्रांस के समुद्र-पार क्षेत्रों की वजह से उसके 12 टाइम ज़ोन हैं। 💡 तथ्य: रूस के मुख्य भूभाग में 11 हैं।",ne:"फ्रान्सका विदेशी क्षेत्रका कारण त्यसका १२ टाइम जोन छन्। 💡 तथ्य: रुसको मुख्य भूभागमा ११ छन्।"}},
{c:"gk",d:"hard",q:{en:"Approximate height of Mount Everest?",hi:"माउंट एवरेस्ट की लगभग ऊँचाई कितनी है?",ne:"सगरमाथाको करिब उचाइ कति हो?"},o:["8,611 m","8,849 m","8,167 m","8,586 m"],a:1,e:{en:"Everest is about 8,849 m (2020 official measurement by Nepal and China). 💡 Fact: K2 is 8,611 m, Kanchenjunga 8,586 m.",hi:"एवरेस्ट लगभग 8,849 मीटर ऊँचा है (2020 में नेपाल और चीन की संयुक्त घोषणा)। 💡 तथ्य: K2 8,611 मीटर और कंचनजंघा 8,586 मीटर है।",ne:"सगरमाथा करिब ८,८४९ मिटर उच्च छ (सन् २०२० मा नेपाल र चीनले संयुक्त घोषणा गरे)। 💡 तथ्य: K2 ८,६११ मिटर र कञ्चनजङ्घा ८,५८६ मिटर छ।"}},
/* SCIENCE */
{c:"sci",d:"easy",q:{en:"What is the chemical formula of water?",hi:"पानी का रासायनिक सूत्र क्या है?",ne:"पानीको रासायनिक सूत्र के हो?"},o:["CO2","H2O","O2","NaCl"],a:1,e:{en:"Water has 2 hydrogen atoms and 1 oxygen atom: H2O. 💡 Fact: About 71% of Earth is covered by water.",hi:"पानी में 2 हाइड्रोजन और 1 ऑक्सीजन परमाणु होते हैं: H2O। 💡 तथ्य: पृथ्वी का लगभग 71% हिस्सा पानी से ढका है।",ne:"पानीमा २ हाइड्रोजन र १ अक्सिजन परमाणु हुन्छन्: H2O। 💡 तथ्य: पृथ्वीको करिब ७१% भाग पानीले ढाकिएको छ।"}},
{c:"sci",d:"easy",q:{en:"Which planet is called the Red Planet?",hi:"किस ग्रह को लाल ग्रह कहते हैं?",ne:"कुन ग्रहलाई रातो ग्रह भनिन्छ?"},o:["Venus","Mars","Jupiter","Saturn"],a:1,e:{en:"Mars looks red because of iron oxide (rust) on its surface. 💡 Fact: Mars has the tallest volcano in the solar system, Olympus Mons.",hi:"मंगल की सतह पर आयरन ऑक्साइड (जंग) होने से वह लाल दिखता है। 💡 तथ्य: सौरमंडल का सबसे ऊँचा ज्वालामुखी ओलंपस मॉन्स मंगल पर है।",ne:"मंगलको सतहमा आइरन अक्साइड (खिया) भएकाले यो रातो देखिन्छ। 💡 तथ्य: सौर्यमण्डलको सबैभन्दा अग्लो ज्वालामुखी ओलिम्पस मोन्स मंगलमा छ।"}},
{c:"sci",d:"medium",q:{en:"Which gas do plants take in for photosynthesis?",hi:"प्रकाश संश्लेषण के लिए पौधे कौन-सी गैस लेते हैं?",ne:"प्रकाश संश्लेषणका लागि बिरुवाले कुन ग्यास लिन्छन्?"},o:["Oxygen","Nitrogen","Carbon dioxide","Hydrogen"],a:2,e:{en:"Plants use CO2, water and sunlight to make food and release oxygen. 💡 Fact: Trees you see are mostly built from carbon taken from air.",hi:"पौधे CO2, पानी और धूप से भोजन बनाते हैं और ऑक्सीजन छोड़ते हैं। 💡 तथ्य: पेड़ का ज़्यादातर भाग हवा से लिए कार्बन से बना होता है।",ne:"बिरुवाले CO2, पानी र घामबाट खाना बनाउँछन् र अक्सिजन छोड्छन्। 💡 तथ्य: रूखको धेरैजसो भाग हावाबाट लिइएको कार्बनले बनेको हुन्छ।"}},
{c:"sci",d:"medium",q:{en:"What is the SI unit of force?",hi:"बल का SI मात्रक क्या है?",ne:"बलको SI एकाइ के हो?"},o:["Joule","Newton","Watt","Pascal"],a:1,e:{en:"Force is measured in Newtons (N): F = m × a. 💡 Fact: 1 N is roughly the weight of a small apple.",hi:"बल को न्यूटन (N) में मापते हैं: F = m × a। 💡 तथ्य: 1 N लगभग एक छोटे सेब के वज़न के बराबर है।",ne:"बललाई न्युटन (N) मा नापिन्छ: F = m × a। 💡 तथ्य: १ N करिब एउटा सानो स्याउको तौल बराबर हुन्छ।"}},
{c:"sci",d:"hard",q:{en:"What is the atomic number of Carbon?",hi:"कार्बन का परमाणु क्रमांक क्या है?",ne:"कार्बनको परमाणु संख्या कति हो?"},o:["6","8","12","14"],a:0,e:{en:"Carbon has 6 protons, so its atomic number is 6 (12 is its mass number). 💡 Fact: Diamond and graphite are both pure carbon.",hi:"कार्बन में 6 प्रोटॉन होते हैं, इसलिए परमाणु क्रमांक 6 है (12 द्रव्यमान संख्या है)। 💡 तथ्य: हीरा और ग्रेफाइट दोनों शुद्ध कार्बन हैं।",ne:"कार्बनमा ६ प्रोटोन हुन्छन्, त्यसैले परमाणु संख्या ६ हो (१२ द्रव्यमान संख्या हो)। 💡 तथ्य: हीरा र ग्राफाइट दुवै शुद्ध कार्बन हुन्।"}},
{c:"sci",d:"hard",q:{en:"Approximate speed of light in vacuum?",hi:"निर्वात में प्रकाश की लगभग गति कितनी है?",ne:"निर्वातमा प्रकाशको करिब गति कति हो?"},o:["3×10^6 m/s","3×10^8 m/s","3×10^10 m/s","3×10^5 m/s"],a:1,e:{en:"Light travels about 300,000 km every second (3×10^8 m/s). 💡 Fact: Sunlight takes about 8 minutes to reach Earth.",hi:"प्रकाश हर सेकंड लगभग 3,00,000 किमी चलता है (3×10^8 m/s)। 💡 तथ्य: सूरज की रोशनी को पृथ्वी तक पहुँचने में लगभग 8 मिनट लगते हैं।",ne:"प्रकाश प्रत्येक सेकेन्डमा करिब ३,००,००० किमी चल्छ (3×10^8 m/s)। 💡 तथ्य: सूर्यको प्रकाश पृथ्वीसम्म आइपुग्न करिब ८ मिनेट लाग्छ।"}},
/* MATHS */
{c:"math",d:"easy",q:{en:"12 × 8 = ?",hi:"12 × 8 = ?",ne:"१२ × ८ = ?"},o:["86","96","108","88"],a:1,e:{en:"12 × 8 = (10×8) + (2×8) = 80 + 16 = 96. 💡 Trick: split the bigger number.",hi:"12 × 8 = (10×8) + (2×8) = 80 + 16 = 96। 💡 ट्रिक: बड़ी संख्या को तोड़कर गुणा करो।",ne:"१२ × ८ = (१०×८) + (२×८) = ८० + १६ = ९६। 💡 ट्रिक: ठूलो सङ्ख्यालाई टुक्र्याएर गुणा गर्नुहोस्।"}},
{c:"math",d:"easy",q:{en:"What is the square root of 144?",hi:"144 का वर्गमूल क्या है?",ne:"१४४ को वर्गमूल कति हो?"},o:["11","12","13","14"],a:1,e:{en:"12 × 12 = 144, so √144 = 12. 💡 Fact: learning squares up to 20 makes maths much faster.",hi:"12 × 12 = 144, इसलिए √144 = 12। 💡 तथ्य: 20 तक के वर्ग याद करने से गणित तेज़ हो जाता है।",ne:"१२ × १२ = १४४, त्यसैले √१४४ = १२। 💡 तथ्य: २० सम्मको वर्ग याद गर्दा गणित छिटो हुन्छ।"}},
{c:"math",d:"medium",q:{en:"What is 15% of 200?",hi:"200 का 15% कितना होता है?",ne:"२०० को १५% कति हुन्छ?"},o:["20","25","30","35"],a:2,e:{en:"10% of 200 = 20, 5% = 10, so 15% = 30. 💡 Trick: find 10% first, then half of it for 5%.",hi:"200 का 10% = 20, 5% = 10, तो 15% = 30। 💡 ट्रिक: पहले 10% निकालो, फिर उसका आधा 5% होता है।",ne:"२०० को १०% = २०, ५% = १०, त्यसैले १५% = ३०। 💡 ट्रिक: पहिले १०% निकाल्नुहोस्, त्यसको आधा ५% हुन्छ।"}},
{c:"math",d:"medium",q:{en:"Solve: 2x + 5 = 17. x = ?",hi:"हल करो: 2x + 5 = 17. x = ?",ne:"हल गर्नुहोस्: 2x + 5 = 17. x = ?"},o:["5","6","7","8"],a:1,e:{en:"2x = 17 − 5 = 12, so x = 6. 💡 Tip: do the same step on both sides of '='.",hi:"2x = 17 − 5 = 12, इसलिए x = 6। 💡 सुझाव: '=' के दोनों तरफ़ एक जैसा काम करो।",ne:"२x = १७ − ५ = १२, त्यसैले x = ६। 💡 सुझाव: '=' का दुवै तर्फ एउटै कार्य गर्नुहोस्।"}},
{c:"math",d:"hard",q:{en:"Next number: 2, 6, 12, 20, ?",hi:"अगली संख्या: 2, 6, 12, 20, ?",ne:"अर्को सङ्ख्या: २, ६, १२, २०, ?"},o:["28","30","32","36"],a:1,e:{en:"Differences are 4, 6, 8, so next difference is 10: 20 + 10 = 30. 💡 Fact: these are n × (n+1) numbers.",hi:"अंतर 4, 6, 8 हैं, अगला अंतर 10 होगा: 20 + 10 = 30। 💡 तथ्य: ये n × (n+1) वाली संख्याएँ हैं।",ne:"फरक ४, ६, ८ छन्, अर्को फरक १० हुन्छ: २० + १० = ३०। 💡 तथ्य: यी n × (n+1) का सङ्ख्या हुन्।"}},
{c:"math",d:"hard",q:{en:"2^10 = ?",hi:"2^10 = ?",ne:"२^१० = ?"},o:["512","1024","2048","1000"],a:1,e:{en:"2^10 = 1024. 💡 Fact: 1 KB in computers is 1024 bytes because of this.",hi:"2^10 = 1024। 💡 तथ्य: इसी वजह से कंप्यूटर में 1 KB = 1024 बाइट होता है।",ne:"२^१० = १०२४। 💡 तथ्य: यसैकारण कम्प्युटरमा १ KB = १०२४ बाइट हुन्छ।"}},
/* ENGLISH */
{c:"eng",d:"easy",q:{en:"Opposite of 'Hot'?",hi:"'Hot' का विलोम शब्द क्या है?",ne:"'Hot' को विपरीतार्थी शब्द के हो?"},o:["Cold","Hard","Tall","Slow"],a:0,e:{en:"The opposite (antonym) of hot is cold. 💡 Tip: learn words in pairs to double your vocabulary.",hi:"Hot का विलोम Cold है। 💡 सुझाव: शब्द जोड़ियों में सीखो, vocabulary दोगुनी हो जाएगी।",ne:"Hot को विपरीतार्थी Cold हो। 💡 सुझाव: शब्द जोडीमा सिक्नुहोस्, शब्दभण्डार दोब्बर हुन्छ।"}},
{c:"eng",d:"easy",q:{en:"Plural of 'Child'?",hi:"'Child' का बहुवचन क्या है?",ne:"'Child' को बहुवचन के हो?"},o:["Childs","Children","Childrens","Childes"],a:1,e:{en:"Child is an irregular noun: child → children. 💡 Also: man → men, foot → feet.",hi:"Child एक irregular noun है: child → children। 💡 और भी: man → men, foot → feet।",ne:"Child irregular noun हो: child → children। 💡 अरू: man → men, foot → feet।"}},
{c:"eng",d:"medium",q:{en:"Choose the correct spelling.",hi:"सही स्पेलिंग चुनो।",ne:"सही हिज्जे छान्नुहोस्।"},o:["Recieve","Receive","Receve","Receeve"],a:1,e:{en:"Rule: 'i before e, except after c' → receive. 💡 Fact: English has many such spelling rules.",hi:"नियम: 'i before e, except after c' → receive। 💡 तथ्य: अंग्रेज़ी में ऐसे कई स्पेलिंग नियम हैं।",ne:"नियम: 'i before e, except after c' → receive। 💡 तथ्य: अङ्ग्रेजीमा यस्ता धेरै हिज्जे नियम छन्।"}},
{c:"eng",d:"medium",q:{en:"'She ___ to school every day.'",hi:"'She ___ to school every day.' खाली जगह भरो।",ne:"'She ___ to school every day.' खाली ठाउँ भर्नुहोस्।"},o:["go","goes","going","gone"],a:1,e:{en:"With he/she/it in present simple, add -s/-es: she goes. 💡 Tip: I/you/we/they → go.",hi:"Present simple में he/she/it के साथ -s/-es लगता है: she goes। 💡 सुझाव: I/you/we/they → go।",ne:"Present simple मा he/she/it सँग -s/-es लाग्छ: she goes। 💡 सुझाव: I/you/we/they → go।"}},
{c:"eng",d:"hard",q:{en:"Meaning of 'Benevolent'?",hi:"'Benevolent' का अर्थ क्या है?",ne:"'Benevolent' को अर्थ के हो?"},o:["Cruel","Kind","Lazy","Clever"],a:1,e:{en:"Benevolent means kind and generous. 💡 Memory trick: 'bene' = good (like benefit).",hi:"Benevolent का अर्थ दयालु और उदार है। 💡 याद रखने की ट्रिक: 'bene' = अच्छा (जैसे benefit)।",ne:"Benevolent को अर्थ दयालु र उदार हो। 💡 सम्झने ट्रिक: 'bene' = राम्रो (जस्तै benefit)।"}},
{c:"eng",d:"hard",q:{en:"'Neither of the boys ___ present.'",hi:"'Neither of the boys ___ present.' खाली जगह भरो।",ne:"'Neither of the boys ___ present.' खाली ठाउँ भर्नुहोस्।"},o:["were","was","are","be"],a:1,e:{en:"'Neither' is singular, so it takes 'was'. 💡 Same for 'each' and 'either'.",hi:"'Neither' एकवचन है, इसलिए 'was' आता है। 💡 'each' और 'either' के साथ भी यही नियम है।",ne:"'Neither' एकवचन हो, त्यसैले 'was' आउँछ। 💡 'each' र 'either' सँग पनि यही नियम हो।"}}
];

function notif(){const p=load();const L=[];
 if(p.day!==today())L.push(["🎁","Daily reward ready","daily()"]);
 if(p.spin!==today())L.push(["🎰","Free Lucky Spin","spin()"]);
 if(cleared(p)<10)L.push(["🎯","Continue Level "+Math.min(p.lvl,10),"levels()"]);
 app.innerHTML=`<h1>🔔 Notifications</h1><div class="card">`+(L.length?L.map(x=>`<button class="opt" onclick="${x[2]}">${x[0]} ${x[1]}</button>`).join(""):`<div class="bubble">All caught up ✅</div>`)+`</div><button class="btn sec" onclick="home()">${t('home')}</button>`}

function achievements(){const p=load();

async function startGame(){
 S={used:[],i:0,you:0,ai:0,right:0,streak:0,wrongStreak:0,level:cfg.diff==="smart"?(ageG()==="kid"?"easy":"medium"):cfg.diff,online:[],note:"",coins:0,bet:0};
 {const p=load();const b=Number(cfg.bet)||0;if(cfg.mode!=="teacher"&&b>0&&!isKid()&&p.coins>=b){p.coins-=b;save(p);S.bet=b}}
 if(cfg.online&&!isKid()&&cfg.cat!=="eng"&&cfg.cat!=="pic"){
  app.innerHTML=`<div class="card"><div class="nex">${avatar()}<div class="bubble">${t('loading')}</div></div></div>`;
  S.online=await fetchOnline();
  if(!S.online.length)S.note=t('offl');
 }
 if(cfg.mode!=="teacher"){
  app.innerHTML=`<div class="vs"><div class="side">${phHTML(96)}<div>${t('you')}</div></div><b>VS</b><div class="side">${avatar()}<div>NEXbrain</div></div></div>${S.bet?`<div class="rank">🪙 ${S.bet} ×2</div>`:''}`;
  await new Promise(r=>setTimeout(r,1800));
 }
 nextQ();
}

async function fetchOnline(){
 const map={gk:9,sci:17,math:19};
 const cats=cfg.cat==="all"?[9,17,19]:[map[cfg.cat]];
 const dm={easy:"easy",medium:"medium",hard:"hard"};
 const d=dm[S.level]||"medium";
 const out=[];
 try{
  for(const c of cats){
   const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),7000);
   const r=await fetch(`https://opentdb.com/api.php?amount=${cats.length>1?3:ROUND}&category=${c}&difficulty=${d}&type=multiple`,{signal:ctl.signal});
   clearTimeout(to);
   const j=await r.json();
   (j.results||[]).forEach(x=>{
    const dec=s=>{const e=document.createElement("textarea");e.innerHTML=s;return e.value};
    const opts=x.incorrect_answers.map(dec);const ans=dec(x.correct_answer);
    const pos=Math.floor(Math.random()*4);opts.splice(pos,0,ans);
    const q=dec(x.question);
    const ex=`✅ ${ans}`;
    out.push({c:"online",d:x.difficulty,q:{en:q,hi:q,ne:q},o:opts,a:pos,e:{en:ex+" 💡 AI question from the internet.",hi:ex+" 💡 इंटरनेट से आया AI सवाल।",ne:ex+" 💡 इन्टरनेटबाट आएको AI प्रश्न।"}});
   });
  }
 }catch(e){}
 return out.sort(()=>Math.random()-.5);
}

function nextQ(){
 if(S.i>=ROUND)return result();
 let q=null;
 if(S.online.length){q=S.online.shift()}
 else{
  let pool=Q.filter((x,ix)=>!S.used.includes(ix)&&(cfg.cat==="all"||x.c===cfg.cat));
  if(!pool.length)return result();
  let lv=pool.filter(x=>x.d===S.level);
  if(isKid()&&!lv.length){const nh=pool.filter(x=>x.d!=="hard");if(nh.length)lv=nh}
  q=pick(lv.length?lv:pool);S.used.push(Q.indexOf(q));
 }
 S.q=q;S.i++;S.locked=false;S.left=TIME;
 const bp={easy:.5,medium:.65,hard:.8}[(q.d||S.level)]||.65;
 const wantBattle=cfg.mode!=="teacher";
 S.aiPick=wantBattle?(Math.random()<bp?q.a:pick([0,1,2,3].filter(x=>x!==q.a))):null;
 render();
 clearInterval(timerId);
 timerId=setInterval(()=>{S.left-=.1;const b=$("#tb");if(b)b.style.width=Math.min(100,Math.max(0,S.left/TIME*100))+"%";const n=$("#tn");if(n)n.textContent=Math.max(0,Math.ceil(S.left));if(S.left>0&&S.left<=5&&Math.round(S.left*10)%10===0)snd("tick");if(S.left<=0){clearInterval(timerId);answer(-1)}},100);
}

function teacherNow(){return cfg.mode==="teacher"||(cfg.mode==="smart"&&S.wrongStreak>=2)}

function render(){
 const q=S.q;
 const msg=cfg.mode==="teacher"?t('tch'):(cfg.mode==="battle"?t('bat'):(teacherNow()?t('tch'):t('bat')));
 app.innerHTML=`<div class="top"><b>${t('q')} ${S.i}/${ROUND}</b><span>🪙 <b id="cn">${load().coins}</b> &nbsp; ⏱ <b id="tn">${TIME}</b>s</span></div>
 <div class="bar"><i id="tb"></i></div>
 <div class="score"><div>${phHTML(34)}<b>${S.you}</b>${t('you')}</div>${cfg.mode!=="teacher"?`<div><b>${S.ai}</b>${t('ai')}</div>`:''}<div><b>${S.streak}</b>🔥</div></div>
 <div class="card"><div class="nex">${avatar()}<div class="bubble" id="say">${S.note||msg}</div></div></div>
 <div class="card">${q.img?`<img class="pic" src="${q.img}" alt="">`:''}${q.em?`<div class="emo">${q.em}</div>`:''}<div class="q">${q.q[cfg.lang]}</div><div id="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div id="pu" class="row" style="margin-top:6px"><div class="chip" onclick="useFifty()">✂️ 50-50 (${load().fifty})</div><div class="chip" onclick="useTime()">⏱ +5s (${load().time})</div></div><div id="fb"></div></div>`;
 S.note="";
}

function answer(i){
 if(S.locked)return;S.locked=true;clearInterval(timerId);
 const q=S.q,ok=i===q.a;
 const btns=[...document.querySelectorAll(".opt")];
 btns.forEach((b,ix)=>{b.disabled=true;if(ix===q.a)b.classList.add("ok");else if(ix===i)b.classList.add("bad")});
 const pu=$("#pu");if(pu)pu.style.display="none";
 snd(i===q.a?"ok":"bad");
 let gain=0;
 if(ok){S.you++;S.right++;S.streak++;S.wrongStreak=0;gain=10+(q.d==="hard"?5:0)+(S.streak>=3?5:0);const pp=load();pp.coins+=gain;save(pp);S.coins+=gain;const cn=$("#cn");if(cn)cn.textContent=pp.coins}else{S.streak=0;S.wrongStreak++}
 let aiTxt="";
 if(S.aiPick!==null){const aiOk=S.aiPick===q.a;if(aiOk)S.ai++;aiTxt=`<div style="margin-top:8px;font-size:13px;color:var(--mut)">🤖 ${t('gotit')}: ${String.fromCharCode(65+S.aiPick)}. ${q.o[S.aiPick]} ${aiOk?'✅':'❌'}</div>`}
 if(cfg.diff==="smart"){const L=["easy","medium","hard"];let k=L.indexOf(S.level);k=ok?Math.min(isKid()?1:2,k+1):Math.max(0,k-1);S.level=L[k]}
 const say=ok?pick(T[cfg.lang].ok1):(i===-1?t('time'):pick(T[cfg.lang].bad1));
 $("#say").textContent=say;
 $(".nex svg").outerHTML=avatar(ok?"happy":"sad");
 $("#fb").innerHTML=`<div class="exp"><b>${ok?t('right'):(i===-1?t('time'):t('wrong'))}</b> ${gain?`<b style="color:#fbbf24">+${gain} 🪙</b> `:''}${t('correct')}: <b>${String.fromCharCode(65+q.a)}. ${q.o[q.a]}</b><br>${q.e[cfg.lang]}</div>${aiTxt}<button class="btn" onclick="nextQ()">${S.i>=ROUND||(!S.online.length&&Q.filter((x,ix)=>!S.used.includes(ix)&&(cfg.cat==="all"||x.c===cfg.cat)).length===0)?t('finish'):t('next')}</button>`;
}

function result(){
 clearInterval(timerId);
 const n=S.i,acc=n?Math.round(S.right/n*100):0;
 const p=load();let betMsg="";
 if(S.bet&&cfg.mode!=="teacher"){if(S.you>S.ai){p.coins+=S.bet*2;betMsg=`+${S.bet*2} 🪙 (${c('betwin')})`}else if(S.you===S.ai){p.coins+=S.bet;betMsg=c('betdraw')}else betMsg=`-${S.bet} 🪙`}
 let lvMsg="";
 if(LV){const pass=S.right>=3;const st=S.right>=5?3:S.right>=4?2:S.right>=3?1:0;const prev=p.stars[LV]||0;
  if(pass){if(!prev){const rw=30+LV*10;p.coins+=rw;lvMsg=`🎉 Level ${LV} ✅ +${rw} 🪙`}else lvMsg=`Level ${LV} ✅`;
   p.stars[LV]=Math.max(prev,st);if(LV===p.lvl&&LV<10)p.lvl=LV+1}
  else lvMsg=`Level ${LV} ❌ (3/5)`;
  S.lvPass=pass}
 p.games++;p.total+=n;p.right+=S.right;p.best=Math.max(p.best,S.you);save(p);lbAdd(S.you,n,acc);syncOnline(p);snd(S.you>=S.ai?"win":"bad");
 let verdict="";
 if(cfg.mode!=="teacher"){verdict=S.you>S.ai?t('win'):(S.you<S.ai?t('lose'):t('draw'))}
 const tip=acc>=75?t('tipGood'):(acc>=40?t('tipMid'):t('tipLow'));
 app.innerHTML=`<h1>🏆 ${t('result')}</h1>
 <div class="card"><div class="nex">${phHTML(56)}${avatar(S.you>=S.ai?'happy':'sad')}<div class="bubble">${verdict||t('tch')}</div></div></div>
 <div class="card"><div class="big">${S.you}/${n}</div><div class="rank">🏅 ${acc>=90?"Quiz Master 👑":acc>=70?"Pro Player ⭐":acc>=40?"Challenger 🔥":"Rookie 🌱"}</div>
 <div class="score" style="margin-top:10px"><div><b>${acc}%</b>${t('acc')}</div>${cfg.mode!=="teacher"?`<div><b>${S.ai}</b>${t('ai')}</div>`:''}<div><b>${S.streak}</b>🔥</div></div>
 <div class="exp">🪙 +${S.coins} ${c('earned')}${betMsg?' · '+betMsg:''} · ${c('total')}: ${p.coins}${lvMsg?'<br><b>'+lvMsg+'</b>':''}</div>
 <div class="lbl">${t('rep')}</div><div class="exp">${t('tip')}: ${tip}</div></div>${adBanner()}
 ${LV?((S.lvPass&&LV<10?`<button class="btn" onclick="startLevel(${LV+1})">Next Level ➜</button>`:'')+`<button class="btn ${S.lvPass&&LV<10?'sec':''}" onclick="startLevel(${LV})">🔁 Retry</button><button class="btn sec" onclick="levels()">🎯 Levels</button>`):`<button class="btn" onclick="startGame()">${t('again')}</button>`}<button class="btn sec" onclick="home()">${t('home')}</button>`;
}

let AC=null;
function muted(){try{return localStorage.getItem("nex_mute")==="1"}catch(e){return false}}
function snd(type){try{if(muted())return;AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const seq={ok:[[660,.1],[880,.15]],bad:[[200,.25]],tick:[[900,.05]],win:[[523,.12],[659,.12],[784,.12],[1047,.3]],coin:[[1200,.07],[1600,.1]]}[type]||[];
 let t0=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==="bad"?"sawtooth":"sine";o.frequency.value=f;g.gain.setValueAtTime(.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d);t0+=d})}catch(e){}}
function toggleSound(){try{localStorage.setItem("nex_mute",muted()?"0":"1")}catch(e){}settings()}
function pname(){try{return localStorage.getItem("nex_name")||""}catch(e){return""}}
function setName(v){try{localStorage.setItem("nex_name",v)}catch(e){}}
function lbGet(){try{return JSON.parse(localStorage.getItem("nex_lb"))||[]}catch(e){return[]}}
function lbAdd(s,n,acc){const l=lbGet();l.push({n:pname()||"Player",s:s,q:n,acc:acc,d:today()});l.sort((a,b)=>b.s-a.s||b.acc-a.acc);try{localStorage.setItem("nex_lb",JSON.stringify(l.slice(0,10)))}catch(e){}}
function board0(){const l=lbGet();
 app.innerHTML=`<h1>🏆 Leaderboard</h1><div class="row" style="margin-bottom:8px"><div class="chip on">📱 Local</div>${isKid()?'':'<div class="chip" onclick="boardOnline()">🌍 Online</div>'}</div><div class="card">`+(l.length?l.map((x,i)=>`<div class="opt" style="cursor:default">${["🥇","🥈","🥉"][i]||(i+1)+"."} <b>${x.n}</b> — ${x.s}/${x.q} (${x.acc}%) <small>${x.d}</small></div>`).join(""):`<div class="bubble">—</div>`)+`</div><button class="btn" onclick="share()">📤 Share</button><button class="btn sec" onclick="home()">${t('home')}</button>`}
function share(){const l=lbGet()[0];const tx=`AI QUIZ BATTLE 🎮 ${pname()||"Me"}: ${l?l.s+"/"+l.q+" ("+l.acc+"%)":""} – Can you beat NEXbrain?`;
 if(navigator.share)navigator.share({text:tx}).catch(()=>{});else{try{navigator.clipboard.writeText(tx);alert("Copied!")}catch(e){alert(tx)}}}

/* ========== GOOGLE SIGN-IN (Firebase Auth) ==========
 Firebase console > Project settings > Your apps > Web app: copy the values below.
 Then Authentication > Sign-in method > enable Google, and add your site under Authorized domains. */
const FIREBASE_CONFIG={apiKey:"",authDomain:"",projectId:"",appId:""};
let USER=null;
function authReady(){return !!FIREBASE_CONFIG.apiKey}
function loadScript(s){return new Promise((res,rej)=>{const e=document.createElement("script");e.src=s;e.onload=res;e.onerror=rej;document.head.appendChild(e)})}
async function initAuth(){if(!authReady())return;
 try{await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js");
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().onAuthStateChanged(u=>{USER=u||null;if(u&&!pname())setName((u.displayName||"Player").slice(0,14));if(u){applyRef();claimRefs(true)}refreshIfProfile()});
 }catch(e){}}
function refreshIfProfile(){const on=document.querySelector("#nav .on");if(!on)return;const t=on.textContent;if(t.indexOf("Profile")>=0)profile();else if(t.indexOf("Home")>=0)home()}

/* ========== REWARDED ADS ==========
 Web has no AdMob. In the Android wrapper app (WebView) expose a JavaScript interface named AndroidAds
 with showRewarded(); when the user finishes the ad, call window.onRewardedAd(true) (or false if skipped).
 ADS_DEMO is true only while you test on your own phone/computer (localhost or a file), never on a public website or in the APK. */
const ADS_DEMO=(location.protocol==="file:"||/^(localhost|127\.0\.0\.1|192\.168\.\d+\.\d+)$/.test(location.hostname))&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()),AD_COINS=20,AD_MAX=5,AD_GAP=30000;
let adBusy=false,adLast=0;
function adLeft(p){return p.adDay===today()?Math.max(0,AD_MAX-(p.adN||0)):AD_MAX}
function watchAd(){const p=load();if(adBusy)return;
 if(adLeft(p)<=0)return toast("📺 Daily ad limit reached. Come back tomorrow!");
 if(Date.now()-adLast<AD_GAP)return toast("⏳ Please wait a little before the next ad.");
 adBusy=true;
 if(window.AndroidAds&&window.AndroidAds.showRewarded){try{window.AndroidAds.showRewarded();return}catch(e){adBusy=false;return toast("Ad not ready, try again.")}}
 if(!ADS_DEMO){adBusy=false;return toast("Ads are available in the Android app.")}
 let n=5;app.innerHTML=`<div class="card"><div class="big" id="ad">${n}</div><div class="tag">📺 Demo ad</div></div>`;
 const iv=setInterval(()=>{n--;const e=$("#ad");if(e)e.textContent=n;if(n<=0){clearInterval(iv);window.onRewardedAd(true)}},1000)}
window.onRewardedAd=function(ok){adBusy=false;adLast=Date.now();
 if(!ok)return toast("Ad was not completed, so no reward.");
 const p=load();if(adLeft(p)<=0)return home();
 if(p.adDay!==today()){p.adDay=today();p.adN=0}p.adN++;p.coins+=AD_COINS;save(p);snd("coin");toast(`📺 +${AD_COINS} 🪙 (${adLeft(p)} left today)`)};

/* ========== COINS: Daily, Spin, Shop, Power-ups ========== */
function today(d){return (d||new Date()).toLocaleDateString('en-CA')}
function toast(m){home();const d=document.createElement("div");d.className="card";d.innerHTML="<div class='big' style='font-size:22px'>"+m+"</div>";app.prepend(d)}
function daily(){const p=load();const td=today();if(p.day===td)return toast(c('claimed'));
 const y=today(new Date(Date.now()-864e5));p.dstreak=(p.day===y)?p.dstreak+1:1;
 const r=20+10*Math.min(p.dstreak-1,6);p.coins+=r;p.day=td;save(p);snd("coin");toast(`🎁 +${r} 🪙 · ${c('streak')} ${p.dstreak}`)}
function spin(){const p=load();const free=p.spin!==today();if(isKid()&&!free)return toast("🎰 Come back tomorrow for your free spin!");
 if(!free&&p.coins<30)return toast(c('nocoin'));
 if(!free)p.coins-=30;p.spin=today();save(p);
 const prizes=[5,10,10,20,20,30,50,100,"fifty","time"];const w=pick(prizes);
 const lab=x=>x==="fifty"?"✂️ 50-50":x==="time"?"⏱ +5s":"🪙 "+x;
 app.innerHTML=`<div class="card"><div class="big" id="sp">🎰</div></div>`;
 let n=0;const iv=setInterval(()=>{$("#sp").textContent=lab(pick(prizes));
  if(++n>14){clearInterval(iv);const q=load();if(typeof w==="number")q.coins+=w;else q[w]++;save(q);$("#sp").textContent="🎉 "+lab(w);setTimeout(()=>toast("🎉 "+lab(w)),1300)}},110)}
const ITEMS=[{id:"fifty",n:"✂️ 50-50",p:30,t:"pu"},{id:"time",n:"⏱ +5s",p:20,t:"pu"},{id:"blue",n:"🔵 Classic NEXbrain",p:0,t:"skin"},{id:"gold",n:"🟡 Gold NEXbrain",p:200,t:"skin"},{id:"green",n:"🟢 Neon NEXbrain",p:150,t:"skin"},{id:"purple",n:"🟣 Galaxy NEXbrain",p:250,t:"skin"}];
function shop(){const p=load();
 app.innerHTML=`<h1>🛒 ${c('shop')}</h1><div class="card"><div class="score"><div><b>🪙 ${p.coins}</b>Coins</div></div>`+
 ITEMS.map(it=>{const own=it.t==="skin"&&p.skins.includes(it.id);const eq=p.skin===it.id;
  const r=it.t==="pu"?`🪙 ${it.p} (x${p[it.id]})`:(eq?"✅ "+c('equipped'):(own?c('equip'):"🪙 "+it.p));
  return `<button class="opt" onclick="buy('${it.id}')">${it.n} — ${r}</button>`}).join("")+
 `</div><div class="card"><div class="nex">${avatar()}<div class="bubble">${c('shopsay')}</div></div></div><button class="btn sec" onclick="home()">${t('home')}</button>`}
function buy(id){const p=load();const it=ITEMS.find(x=>x.id===id);
 if(it.t==="pu"){if(p.coins<it.p)return alert(c('nocoin'));p.coins-=it.p;p[id]++}
 else{if(!p.skins.includes(id)){if(p.coins<it.p)return alert(c('nocoin'));p.coins-=it.p;p.skins.push(id)}p.skin=id}
 save(p);shop()}
function useFifty(){if(!S||S.locked)return;const p=load();if(p.fifty<1)return;p.fifty--;save(p);
 const wrong=[0,1,2,3].filter(x=>x!==S.q.a).sort(()=>Math.random()-.5).slice(0,2);
 const bs=document.querySelectorAll(".opt");wrong.forEach(i=>{bs[i].style.visibility="hidden"});
 const ch=document.querySelector("#pu .chip");if(ch)ch.textContent="✂️ 50-50 ("+p.fifty+")"}
function useTime(){if(!S||S.locked)return;const p=load();if(p.time<1)return;p.time--;save(p);S.left=Math.min(S.left+5,20);
 const ch=document.querySelectorAll("#pu .chip")[1];if(ch)ch.textContent="⏱ +5s ("+p.time+")"}

/* ========== ANDROID APP (Capacitor + AdMob rewarded ads) ==========
 Only runs inside the Android app. On the web this block does nothing. */
(function(){try{
 const C=window.Capacitor;if(!(C&&C.isNativePlatform&&C.isNativePlatform()))return;
 const AdMob=C.Plugins&&C.Plugins.AdMob;if(!AdMob)return;
 let conf=null,ready=false;
 window.__adReset=function(){ready=false};
 async function getConf(){if(conf)return conf;
  try{conf=await (await fetch("admob.json")).json()}catch(e){conf={rewardedId:"ca-app-pub-3940256099942544/5224354917",testing:true}}return conf}
 window.AndroidAds={showRewarded:async function(){
  let ok=false,earned=false,subs=[];
  try{const c=await getConf();
   if(!ready){const g=(function(){try{return localStorage.getItem("nex_age")||"teen"}catch(e){return"teen"}})();
   await AdMob.initialize({initializeForTesting:!!c.testing,tagForChildDirectedTreatment:g==="kid",tagForUnderAgeOfConsent:g!=="adult",maxAdContentRating:g==="kid"?"General":(g==="teen"?"Teen":"MatureAudience")});ready=true}
   subs.push(await AdMob.addListener("onRewardedVideoAdReward",function(){earned=true}));
   await AdMob.prepareRewardVideoAd({adId:c.rewardedId,isTesting:!!c.testing});
   await AdMob.showRewardVideoAd();ok=true}
  catch(e){ok=earned}
  try{subs.forEach(function(h){h&&h.remove&&h.remove()})}catch(e){}
  window.onRewardedAd(ok)}};
}catch(e){}})();

if(!ageG())ageScreen();else home();initRef();claimRefs(true);initAuth();
</script>
